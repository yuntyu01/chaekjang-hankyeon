name: chaekjang
description: "책장 한켠 (Flutter 이식)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  sqflite: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 굽기 입력(지금 앱의 빛 모델이 뽑은 줄 하나, tool/gen_shaders.sh)
  assets:
    - assets/header/
    - assets/bake_case.json

  # 제목 글꼴(지금 앱과 같은 함렛 SemiBold)
  fonts:
    - family: Hahmlet
      fonts:
        - asset: assets/fonts/Hahmlet-SemiBold.ttf
    # 화면 글꼴(지금 앱과 같은 Pretendard 한 가족: 굵기는 파일로 고른다)
    - family: PretendardRegular
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
    - family: PretendardMedium
      fonts:
        - asset: assets/fonts/Pretendard-Medium.otf
    - family: PretendardSemiBold
      fonts:
        - asset: assets/fonts/Pretendard-SemiBold.otf
    - family: PretendardBold
      fonts:
        - asset: assets/fonts/Pretendard-Bold.otf
    # 갈피 문장·대체 표지 글꼴(지금 앱 ReadingSerif = 본명조 Noto Serif KR)
    - family: ReadingSerif
      fonts:
        - asset: assets/fonts/NotoSerifKR-Regular.otf

  # 빛 셰이더: 빌드할 때 impellerc가 미리 컴파일한다(기기에서 처음 그릴 때 컴파일하지 않는다).
  # 소스는 tool/gen_shaders.sh 가 만든다(출처: ../app/src/ui/scene-light-sksl.ts)
  shaders:
    - shaders/grid.frag
    - shaders/bake.frag
    - shaders/lit.frag
    - shaders/book.frag
    - shaders/tab.frag
