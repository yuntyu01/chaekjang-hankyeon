name: chaekjang
description: "책장 한켠 (Flutter 이식)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  package_info_plus: ^10.2.2
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 굽기 입력(지금 앱의 빛 모델이 뽑은 줄 하나, tool/gen_shaders.sh)
  assets:
    - assets/header/
    # 분위기 장면 영상·미리보기, 환경음(지금 앱 assets/scenes·sounds 그대로, 출처는 각 provenance.json)
    - assets/scenes/
    - assets/sounds/
    - assets/bake_case.json
    # 지금 앱 QA 비교 서재(tool/dump_qa_seed.test.ts): 빈 서재에 넣어 두 앱을 같은 데이터로 견준다
    - assets/qa_seed.json
    # 잠긴 칸 안 흐린 예시 책(tool/dump_locked.test.ts)
    - assets/locked_preview.json
    # 기본 정면 장정 그림 6종(지금 앱 assets/covers/artworks: 표지 720×1080, 고르기 썸네일 180×270)
    - assets/covers/artworks/
    # 공유 그림 바탕·오버레이(지금 앱 assets/share: 시안에서 글자·책을 지운 바탕, 책 빛 지도, 선반 그늘)
    - assets/share/

  # 제목 글꼴(지금 앱과 같은 함렛 SemiBold)
  fonts:
    - family: Hahmlet
      fonts:
        - asset: assets/fonts/Hahmlet-SemiBold.ttf
    # 화면 글꼴(지금 앱과 같은 Pretendard 한 가족: 굵기는 파일로 고른다)
    - family: PretendardRegular
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
    - family: PretendardMedium
      fonts:
        - asset: assets/fonts/Pretendard-Medium.otf
    - family: PretendardSemiBold
      fonts:
        - asset: assets/fonts/Pretendard-SemiBold.otf
    - family: PretendardBold
      fonts:
        - asset: assets/fonts/Pretendard-Bold.otf
    # 갈피 문장·대체 표지 글꼴(지금 앱 ReadingSerif = 본명조 Noto Serif KR)
    - family: MaruBuriRegular
      fonts:
        - asset: assets/fonts/MaruBuri-Regular.ttf
    - family: MaruBuriSemiBold
      fonts:
        - asset: assets/fonts/MaruBuri-SemiBold.ttf
    - family: ReadingSerif
      fonts:
        - asset: assets/fonts/NotoSerifKR-Regular.otf

  # 빛 셰이더: 빌드할 때 impellerc가 미리 컴파일한다(기기에서 처음 그릴 때 컴파일하지 않는다).
  # 소스는 tool/gen_shaders.sh 가 만든다(출처: ../app/src/ui/scene-light-sksl.ts)
  shaders:
    - shaders/grid.frag
    - shaders/bake.frag
    - shaders/lit.frag
    - shaders/book.frag
    - shaders/tab.frag
    - shaders/share_cover.frag
    - shaders/share_shade.frag
