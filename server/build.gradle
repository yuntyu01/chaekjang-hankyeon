plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chaekjang'
version = '0.0.1-SNAPSHOT'
description = '책장 한켠 API 서버'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// 설치된 JDK가 17보다 새로워도 Java 17 API·바이트코드로만 컴파일한다.
tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 연결 풀은 DATABASE_URL(postgres://...)을 풀어 직접 구성한다(DatabaseConfig).
	implementation 'com.zaxxer:HikariCP'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	// 사진 파일 저장(R2 등 S3 호환). 동기 호출만 쓰므로 무거운 HTTP 클라이언트 대신 JDK URLConnection 클라이언트를 쓴다.
	implementation platform('software.amazon.awssdk:bom:2.55.0')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'apache-client'
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 도커 없이 진짜 Postgres 바이너리를 띄워 JPA·Flyway를 시험한다.
	testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 개발용 서버(내장 Postgres): ./gradlew devServer
tasks.register('devServer', JavaExec) {
	group = 'application'
	description = '내장 Postgres와 함께 서버를 띄운다(개발용)'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.chaekjang.server.dev.DevServer'
}
