spring.application.name=chaekjang-server
server.port=${PORT:8080}
spring.main.banner-mode=off
# 정적 리소스 매핑을 끄면 알 수 없는 경로가 NoResourceFoundException 대신 바로 404 오류 형식으로 간다.
spring.web.resources.add-mappings=false
# 스키마는 Flyway(db/migration)가 만들고 JPA는 맞는지 검사만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
