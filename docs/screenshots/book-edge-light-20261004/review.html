<main><h1>책 모서리 · 부드러운 반사광과 그늘</h1><p>윗표지와 책등의 외곽선을 제거하고, 3.8DU 폭의 곡면 명암으로 바꿨습니다. 앞·뒤표지와 책등이 같은 광원을 사용하며, 모서리 반경은 4 → 4.5DU로 살짝 늘렸습니다. 아래는 실제 화면을 확대해서 비교한 모습입니다.</p>
