// 기기 안 문장 인식(Android 전용): Google ML Kit Text Recognition v2 한국어 모델(한글·라틴 문자). 모델은 앱에 들어 있어 인터넷 없이 동작한다.
// 사진은 기기 밖으로 보내지 않는다. 다른 문자 모델(중국어·일본어 등)은 넣지 않는다(앱 크기).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.covebook.textrecognition'
version = '0.1.0'

android {
  namespace "app.covebook.textrecognition"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
