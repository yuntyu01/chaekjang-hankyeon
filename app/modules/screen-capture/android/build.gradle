// 앱 창 사진(Android 전용): 다음 실행의 시작 화면에 띄울 홈 사진을 찍는다
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.covebook.screencapture'
version = '0.1.0'

android {
  namespace "app.covebook.screencapture"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // 시작 사진을 띄우면 기기 시작 화면을 걷는다(StartPhoto)
  // 앱이 이미 넣는 라이브러리(자체 저장소의 미리 빌드된 AAR)라 컴파일할 때만 본다. 버전은 패키지에서 읽어 올릴 때 어긋나지 않게 한다
  compileOnly "host.exp.exponent:expo.modules.splashscreen:${new groovy.json.JsonSlurper().parse(new File(rootDir, '../node_modules/expo-splash-screen/package.json')).version}"
}
